[pytest]
# Do not collect the Postgres data directory (permission-noise) as tests.
# app/simulator/tests/__pycache__ holds a stale copy of test_batch_processor
# whose basename collides with tests/test_batch_processor.py (import mismatch).
norecursedirs = postgres_data .venv venv node_modules app/simulator/tests/__pycache__
# Async tests (test_websocket_manager.py, test_phase9_integration.py) use
# @pytest.mark.asyncio without an explicit event-loop fixture.
asyncio_mode = auto
# models test module is intentionally excluded per project convention.
addopts = --ignore=tests/test_models.py --ignore=postgres_data
