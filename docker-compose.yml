services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ptkit_user
      POSTGRES_PASSWORD: pt154
      POSTGRES_DB: ptkit_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  web:
    build: .
    restart: always
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      POSTGRES_DB: ptkit_db
      POSTGRES_USER: ptkit_user
      POSTGRES_PASSWORD: pt154

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
